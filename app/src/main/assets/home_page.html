<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Inicio - Navia Browser TV</title>
    <style>
        :root {
            color-scheme: light;
            --fondo: #f5f6f8;
            --superficie: #ffffff;
            --texto: #1c1b1d;
            --texto-secundario: #5f6368;
            --borde: #e0e3e7;
            --acento: #f57c00;
            --foco-bg: #fff8f0;
            --foco-borde: #f57c00;
            --foco-sombra: 0 10px 28px rgba(245, 124, 0, 0.32);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 32px 6vw 48px;
            background: var(--fondo);
            color: var(--texto);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            overflow-x: hidden;
        }

        main {
            width: min(1180px, 100%);
            margin: 0 auto;
        }

        /* Cabecera con imagen/isotipo de marca */
        .marca {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .marca-icono {
            display: grid;
            width: 54px;
            height: 54px;
            place-items: center;
            border-radius: 18px;
            background: linear-gradient(135deg, #f57c00 0%, #ff9800 100%);
            color: white;
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 6px 18px rgba(245, 124, 0, 0.35);
            letter-spacing: -0.5px;
        }

        .marca-info {
            display: flex;
            flex-direction: column;
        }

        .marca-nombre {
            font-size: 24px;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: -0.3px;
        }

        .marca-subtitulo {
            color: var(--texto-secundario);
            font-size: 14px;
            font-weight: 500;
            margin-top: 2px;
        }

        .bienvenida {
            margin: 0 0 20px;
            font-size: clamp(28px, 3.8vw, 40px);
            font-weight: 800;
            letter-spacing: -0.8px;
            color: #111111;
        }

        /* Barra de busqueda de TV */
        .busqueda-form {
            margin-bottom: 20px;
        }

        .busqueda {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 66px;
            padding: 8px 10px 8px 22px;
            border: 2px solid var(--borde);
            border-radius: 20px;
            background: var(--superficie);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        .busqueda:focus-within {
            border-color: var(--acento);
            box-shadow: var(--foco-sombra);
            transform: scale(1.01);
        }

        .lupa {
            position: relative;
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
            border: 2.5px solid var(--texto-secundario);
            border-radius: 50%;
        }

        .lupa::after {
            position: absolute;
            right: -6px;
            bottom: -5px;
            width: 9px;
            height: 2.5px;
            transform: rotate(45deg);
            border-radius: 2px;
            background: var(--texto-secundario);
            content: "";
        }

        .busqueda input {
            flex: 1;
            min-width: 0;
            height: 48px;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--texto);
            font-size: 20px;
            font-weight: 500;
        }

        .busqueda input::placeholder {
            color: #9aa0a6;
        }

        .boton-buscar {
            min-width: 140px;
            height: 48px;
            border: 0;
            border-radius: 14px;
            background: var(--acento);
            color: white;
            font-size: 16.5px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .boton-buscar:focus {
            background: #e65100;
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(230, 81, 0, 0.45);
        }

        /* Restaurar pestañas */
        .restaurar {
            display: none;
            align-items: center;
            gap: 14px;
            width: 100%;
            min-height: 68px;
            margin: 12px 0 24px;
            padding: 14px 22px;
            border: 2px solid #fbd38d;
            border-radius: 16px;
            background: #fffaf0;
            color: var(--texto);
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            outline: none;
            transition: all 0.2s;
        }

        .restaurar.visible {
            display: flex;
        }

        .restaurar:focus {
            border-color: var(--acento);
            background: #feebc8;
            transform: scale(1.02);
            box-shadow: var(--foco-sombra);
        }

        .restaurar-icono {
            color: var(--acento);
            font-size: 26px;
        }

        .restaurar small {
            display: block;
            margin-top: 3px;
            color: var(--texto-secundario);
            font-size: 13.5px;
            font-weight: 500;
        }

        /* Secciones de Marcadores e Historial con foco de App TV */
        .seccion {
            margin-top: 28px;
        }

        .seccion-cabecera {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .seccion h2 {
            font-size: 22px;
            font-weight: 800;
            color: #1e2022;
        }

        .seccion-ayuda {
            color: var(--texto-secundario);
            font-size: 13.5px;
            font-weight: 500;
        }

        .carrusel {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            padding: 8px 6px 18px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            outline: none;
        }

        .carrusel::-webkit-scrollbar {
            display: none;
        }

        /* Tarjeta con comportamiento de App normal (Android TV Leanback) */
        .tarjeta {
            display: flex;
            flex: 0 0 236px;
            min-width: 236px;
            min-height: 104px;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px 20px;
            border: 2px solid var(--borde);
            border-radius: 18px;
            background: var(--superficie);
            color: var(--texto);
            text-decoration: none;
            scroll-snap-align: start;
            outline: none;
            transition: transform 0.22s cubic-bezier(0.2, 0, 0, 1),
                        border-color 0.22s ease,
                        box-shadow 0.22s ease,
                        background-color 0.22s ease;
            cursor: pointer;
        }

        /* EFECTO FOCO APP NATIVA ANDROID TV */
        .tarjeta:focus {
            transform: scale(1.07) translateY(-2px);
            border-color: var(--foco-borde);
            background-color: var(--foco-bg);
            box-shadow: var(--foco-sombra);
            z-index: 10;
        }

        .tarjeta-icono {
            display: grid;
            width: 38px;
            height: 38px;
            margin-bottom: 12px;
            place-items: center;
            border-radius: 12px;
            background: #fff3e0;
            color: var(--acento);
            font-size: 20px;
        }

        .tarjeta-icono img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 6px;
        }

        .tarjeta-titulo {
            font-size: 16px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #1c1b1d;
        }

        .tarjeta-url {
            margin-top: 4px;
            font-size: 12.5px;
            color: var(--texto-secundario);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .vacio {
            display: flex;
            min-height: 84px;
            align-items: center;
            padding: 18px 22px;
            border: 2px dashed #cbd0d6;
            border-radius: 16px;
            color: var(--texto-secundario);
            font-size: 15px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.6);
        }

        /* Tarjeta destacada de YouTube TV */
        .tarjeta-youtube {
            display: flex;
            flex: 0 0 236px;
            min-width: 236px;
            min-height: 104px;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px 20px;
            border: 2px solid #cc0000;
            border-radius: 18px;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: #ffffff;
            text-decoration: none;
            scroll-snap-align: start;
            outline: none;
            transition: transform 0.22s cubic-bezier(0.2, 0, 0, 1),
                        border-color 0.22s ease,
                        box-shadow 0.22s ease,
                        background-color 0.22s ease;
            cursor: pointer;
        }

        .tarjeta-youtube:focus {
            transform: scale(1.07) translateY(-2px);
            border-color: #ff4444;
            background: linear-gradient(135deg, #ff2222 0%, #dd0000 100%);
            box-shadow: 0 10px 28px rgba(255, 0, 0, 0.35);
            z-index: 10;
        }

        .tarjeta-youtube .tarjeta-icono {
            display: grid;
            width: 38px;
            height: 38px;
            margin-bottom: 12px;
            place-items: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 20px;
        }

        .tarjeta-youtube .tarjeta-titulo {
            font-size: 16px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #ffffff;
        }

        .tarjeta-youtube .tarjeta-url {
            margin-top: 4px;
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.85);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<main>
    <!-- Cabecera con imagen/logo de aplicacion nativa -->
    <header class="marca">
        <div class="marca-icono" aria-hidden="true">N</div>
        <div class="marca-info">
            <p class="marca-nombre">Navia Browser TV</p>
            <p class="marca-subtitulo">Tu espacio para explorar en Android TV</p>
        </div>
    </header>

    <h1 class="bienvenida">¿Qué quieres visitar?</h1>

    <form class="busqueda-form" action="https://www.google.com/search" method="get" id="searchForm">
        <div class="busqueda">
            <span class="lupa" aria-hidden="true"></span>
            <input id="searchInput" type="search" name="q" placeholder="Buscar o escribir una dirección web" aria-label="Buscar o escribir una dirección web" autocomplete="off">
            <button class="boton-buscar" type="submit" id="btnBuscar">Buscar</button>
        </div>
    </form>

    <a class="restaurar" id="restaurar" href="navia://restore-tabs">
        <span class="restaurar-icono" aria-hidden="true">&#8635;</span>
        <span>
            Restablecer pestañas abiertas anteriormente
            <small id="restaurar-detalle"></small>
        </span>
    </a>

    <section class="seccion" aria-labelledby="titulo-marcadores">
        <div class="seccion-cabecera">
            <h2 id="titulo-marcadores">Marcadores</h2>
            <span class="seccion-ayuda">Usa las flechas &#8592; &#8594; del mando</span>
        </div>
        <div class="carrusel" id="marcadores" aria-label="Carrusel de marcadores">
            <!-- Marcador fijo de YouTube TV -->
            <a class="tarjeta-youtube" href="https://www.youtube.com/tv" tabindex="0" id="tarjetaYoutubeTV">
                <span class="tarjeta-icono" aria-hidden="true">&#9658;</span>
                <div>
                    <div class="tarjeta-titulo">YouTube TV</div>
                    <div class="tarjeta-url">youtube.com/tv</div>
                </div>
            </a>
        </div>
    </section>

    <section class="seccion" aria-labelledby="titulo-historial">
        <div class="seccion-cabecera">
            <h2 id="titulo-historial">Historial reciente</h2>
            <span class="seccion-ayuda">Usa las flechas &#8592; &#8594; del mando</span>
        </div>
        <div class="carrusel" id="historial" aria-label="Carrusel del historial"></div>
    </section>
</main>

<script>
    (function () {
        var searchInput = document.getElementById('searchInput');
        var btnBuscar = document.getElementById('btnBuscar');
        var restaurarBtn = document.getElementById('restaurar');
        var tarjetaYoutubeTV = document.getElementById('tarjetaYoutubeTV');

        function navegar(url) {
            window.location.href = url;
        }

        // Forzar clic en la tarjeta fija de YouTube TV (emulador, raton, Enter)
        tarjetaYoutubeTV.addEventListener('click', function(e) {
            e.preventDefault();
            navegar('https://www.youtube.com/tv');
        });

        restaurarBtn.addEventListener('click', function(e) {
            e.preventDefault();
            navegar('navia://restore-tabs');
        });

        function crearTarjeta(item, icono) {
            var enlace = document.createElement('a');
            enlace.className = 'tarjeta';
            enlace.href = item.url;
            enlace.setAttribute('tabindex', '0');

            var simbolo = document.createElement('span');
            simbolo.className = 'tarjeta-icono';
            simbolo.setAttribute('aria-hidden', 'true');
            if (item.icon) {
                var imagen = document.createElement('img');
                imagen.src = item.icon;
                imagen.alt = '';
                simbolo.appendChild(imagen);
            } else {
                simbolo.textContent = icono;
            }

            var textoWrap = document.createElement('div');
            var titulo = document.createElement('div');
            titulo.className = 'tarjeta-titulo';
            titulo.textContent = item.title || item.url;

            var url = document.createElement('div');
            url.className = 'tarjeta-url';
            url.textContent = item.url;

            textoWrap.appendChild(titulo);
            textoWrap.appendChild(url);

            enlace.appendChild(simbolo);
            enlace.appendChild(textoWrap);

            // Forzar la navegacion al hacer clic con raton o emulador
            enlace.addEventListener('click', function(e) {
                e.preventDefault();
                navegar(item.url);
            });

            // Al enfocar con D-Pad, centrar suavemente en pantalla (comportamiento TV Leanback)
            enlace.addEventListener('focus', function() {
                enlace.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            });

            return enlace;
        }

        function renderLista(id, items, icono, mensaje) {
            var lista = document.getElementById(id);
            // Conservar el marcador fijo de YouTube TV
            var fijo = lista.querySelector('.tarjeta-youtube');
            lista.textContent = '';
            if (fijo) lista.appendChild(fijo);
            if (!items.length) {
                var vacio = document.createElement('div');
                vacio.className = 'vacio';
                vacio.textContent = mensaje;
                lista.appendChild(vacio);
                return;
            }
            items.forEach(function (item) {
                if (/^https?:\/\//i.test(item.url)) {
                    lista.appendChild(crearTarjeta(item, icono));
                }
            });
        }

        window.naviaHome = {
            render: function (marcadores, historial, pestañasGuardadas) {
                renderLista('marcadores', marcadores, '★', 'Todavía no tienes marcadores guardados.');
                renderLista('historial', historial, '◷', 'Aquí aparecerán las páginas que visites.');
                if (pestañasGuardadas > 0) {
                    document.getElementById('restaurar-detalle').textContent =
                        pestañasGuardadas + (pestañasGuardadas === 1 ? ' pestaña guardada' : ' pestañas guardadas');
                    restaurarBtn.classList.add('visible');
                }
                window.scrollTo(0, 0);
            }
        };

        // NAVEGACION D-PAD TIPO APP NATIVA DE ANDROID TV
        document.addEventListener('keydown', function(e) {
            var activo = document.activeElement;

            if (e.key === 'ArrowUp') {
                if (activo === searchInput || activo === btnBuscar) {
                    // Notificar a la app para desplegar la barra de herramientas superior
                    navegar('navia://show-toolbar');
                    e.preventDefault();
                } else if (activo === restaurarBtn) {
                    searchInput.focus();
                    e.preventDefault();
                } else if (activo && activo.closest('#marcadores')) {
                    if (restaurarBtn.classList.contains('visible')) {
                        restaurarBtn.focus();
                    } else {
                        searchInput.focus();
                    }
                    e.preventDefault();
                } else if (activo && activo.closest('#historial')) {
                    var primerMarcador = document.querySelector('#marcadores .tarjeta, #marcadores .tarjeta-youtube');
                    if (primerMarcador) primerMarcador.focus();
                    else searchInput.focus();
                    e.preventDefault();
                }
            } else if (e.key === 'ArrowDown') {
                if (activo === searchInput || activo === btnBuscar) {
                    if (restaurarBtn.classList.contains('visible')) {
                        restaurarBtn.focus();
                    } else {
                        var primerMarcador = document.querySelector('#marcadores .tarjeta, #marcadores .tarjeta-youtube');
                        if (primerMarcador) primerMarcador.focus();
                        else {
                            var primerHist = document.querySelector('#historial .tarjeta');
                            if (primerHist) primerHist.focus();
                        }
                    }
                    e.preventDefault();
                } else if (activo === restaurarBtn) {
                    var primerM = document.querySelector('#marcadores .tarjeta, #marcadores .tarjeta-youtube');
                    if (primerM) primerM.focus();
                    e.preventDefault();
                } else if (activo && activo.closest('#marcadores')) {
                    var primerHist = document.querySelector('#historial .tarjeta');
                    if (primerHist) primerHist.focus();
                    e.preventDefault();
                }
            } else if (e.key === 'ArrowRight') {
                if (activo === searchInput) {
                    btnBuscar.focus();
                    e.preventDefault();
                } else if (activo && (activo.classList.contains('tarjeta') || activo.classList.contains('tarjeta-youtube'))) {
                    var siguiente = activo.nextElementSibling;
                    if (siguiente && (siguiente.classList.contains('tarjeta') || siguiente.classList.contains('tarjeta-youtube'))) {
                        siguiente.focus();
                        e.preventDefault();
                    }
                }
            } else if (e.key === 'ArrowLeft') {
                if (activo === btnBuscar) {
                    searchInput.focus();
                    e.preventDefault();
                } else if (activo && (activo.classList.contains('tarjeta') || activo.classList.contains('tarjeta-youtube'))) {
                    var anterior = activo.previousElementSibling;
                    if (anterior && (anterior.classList.contains('tarjeta') || anterior.classList.contains('tarjeta-youtube'))) {
                        anterior.focus();
                        e.preventDefault();
                    }
                }
            } else if (e.key === 'Enter') {
                // Fix: Asegurar que Enter haga clic en las tarjetas
                if (activo && (activo.classList.contains('tarjeta') || activo.classList.contains('tarjeta-youtube'))) {
                    activo.click();
                    e.preventDefault();
                } else if (activo === restaurarBtn) {
                    activo.click();
                    e.preventDefault();
                }
            }
        });

        // Foco inicial en el buscador
        setTimeout(function() {
            searchInput.focus();
        }, 150);
    })();
</script>
</body>
</html>
